---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: blackbox-exporter
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: blackbox-exporter
      namespace: observability
  interval: 1h
  path: ./kubernetes/apps/observability/blackbox-exporter/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  wait: false
