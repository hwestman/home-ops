---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: blackbox-exporter
spec:
  groups:
    - name: blackbox.rules
      rules:
        - alert: ZWaveJSUIUnreachable
          expr: probe_success{job="zwavejs-pi-http"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Z-Wave JS UI is unreachable."
            description: "HTTP probe against Z-Wave JS UI (192.168.1.157:8091) has failed for 5 minutes."
