---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Grafana"
    gethomepage.dev/description: "Metrics dashboards"
    gethomepage.dev/group: "Observability"
    gethomepage.dev/icon: "grafana.svg"
spec:
  hostnames:
    - "grafana.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: grafana
          port: 80
---
# vmalert's own UI: live view of every rule group and its alerts/state,
# without needing to query its API by hand.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vmalert
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "VMAlert"
    gethomepage.dev/description: "Alert rule groups and state"
    gethomepage.dev/group: "Observability"
    gethomepage.dev/icon: "victoriametrics.svg"
spec:
  hostnames:
    - "vmalert.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: vmalert-victoria-metrics-k8s-stack
          port: 8080
---
# Alertmanager's own UI: active/silenced/inhibited alerts, grouping,
# and where to manage silences.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vmalertmanager
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Alertmanager"
    gethomepage.dev/description: "Active alerts and silences"
    gethomepage.dev/group: "Observability"
    gethomepage.dev/icon: "alertmanager.svg"
spec:
  hostnames:
    - "vmalertmanager.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: vmalertmanager-victoria-metrics-k8s-stack
          port: 9093
