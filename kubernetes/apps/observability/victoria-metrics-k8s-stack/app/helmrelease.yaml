---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  interval: 1h
  values:
    defaultDashboards:
      enabled: true
    vmsingle:
      spec:
        retentionPeriod: "14d"
        storage:
          resources:
            requests:
              storage: 10Gi
    # Drop high-cardinality apiserver/etcd histogram buckets - these alone
    # were ~55% of all active series (74.8k of 136k), and are only useful
    # for diagnosing API server performance on large multi-tenant clusters,
    # not something worth the storage cost on a single-node home cluster.
    kubeApiServer:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: https
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
              metricRelabelConfigs:
                - action: drop
                  sourceLabels: [__name__]
                  regex: "apiserver_.*_bucket"
    kubeEtcd:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              metricRelabelConfigs:
                - action: drop
                  sourceLabels: [__name__]
                  regex: "etcd_.*_bucket"
    vlsingle:
      enabled: true
      spec:
        retentionPeriod: "7d"
        storage:
          resources:
            requests:
              storage: 10Gi
    vlagent:
      enabled: true
    grafana:
      fullnameOverride: grafana
      defaultDashboardsEnabled: true
      plugins:
        - victoriametrics-logs-datasource
