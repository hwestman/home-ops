---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  interval: 1h
  values:
    defaultDashboards:
      enabled: true
    vmsingle:
      spec:
        retentionPeriod: "14d"
        storage:
          resources:
            requests:
              storage: 10Gi
    # Cardinality reduction: keep basic request/error totals and averages
    # (_total, _sum, _count, simple gauges) for performance/debugging use;
    # drop histogram buckets (any prefix - etcd's metrics flow through this
    # same apiserver-labeled target too) and internal client-go/apiserver
    # plumbing (workqueue/informer internals, storage-list stats, feature
    # flags) nobody looks at on a home cluster. Cut total series ~136k -> ~50k.
    kubeApiServer:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: https
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
              metricRelabelConfigs:
                - action: drop
                  sourceLabels: [__name__]
                  regex: ".*_bucket"
                - action: drop
                  sourceLabels: [__name__]
                  regex: "workqueue_.*|informer_.*|apiserver_storage_list_.*|apiextensions_openapi_v2_regeneration_count|kubernetes_feature_enabled"
    kubeEtcd:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              metricRelabelConfigs:
                - action: drop
                  sourceLabels: [__name__]
                  regex: "etcd_.*_bucket"
    vlsingle:
      enabled: true
      spec:
        retentionPeriod: "7d"
        storage:
          resources:
            requests:
              storage: 10Gi
    vlagent:
      enabled: true
    grafana:
      fullnameOverride: grafana
      defaultDashboardsEnabled: true
      plugins:
        - victoriametrics-logs-datasource
