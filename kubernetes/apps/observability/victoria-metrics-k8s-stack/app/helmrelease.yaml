---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  interval: 1h
  valuesFrom:
    - kind: Secret
      name: victoria-metrics-k8s-stack-alertmanager-values
      valuesKey: values.yaml
  values:
    defaultDashboards:
      enabled: true
    # Talos runs these bound to 0.0.0.0 (not localhost-only) and they're
    # reachable with the standard serviceaccount bearer token - the chart's
    # default TargetDown/InstanceUnreachable noise was from the pod-selector
    # Service never matching (same root cause as kubeEtcd), not from the
    # metrics actually being unreachable. Their serving certs are Talos's
    # own PKI, not the Kubernetes API server CA, so skip verification
    # rather than trying to source the right CA for two internal-only
    # scrape targets.
    kubeControllerManager:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true
    kubeScheduler:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true
    vmsingle:
      spec:
        retentionPeriod: "14d"
        storage:
          resources:
            requests:
              storage: 10Gi
    # Cardinality reduction: keep basic request/error totals and averages
    # (_total, _sum, _count, simple gauges) for performance/debugging use;
    # drop histogram buckets (any prefix - etcd's metrics flow through this
    # same apiserver-labeled target too) and internal client-go/apiserver
    # plumbing (workqueue/informer internals, storage-list stats, feature
    # flags) nobody looks at on a home cluster. Cut total series ~136k -> ~50k.
    kubeApiServer:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: https
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
              metricRelabelConfigs:
                - action: drop
                  sourceLabels: [__name__]
                  regex: ".*_bucket"
                - action: drop
                  sourceLabels: [__name__]
                  regex: "workqueue_.*|informer_.*|apiserver_storage_list_.*|apiextensions_openapi_v2_regeneration_count|kubernetes_feature_enabled"
    # Default apiserver burn-rate/histogram/SLO alert rules need the
    # _bucket histogram metrics dropped above - disable them rather than
    # let them fire permanently as RecordingRulesNoData.
    defaultRules:
      # count(up == 0) returns no data point (not zero) when nothing is
      # down - PromQL/MetricsQL quirk, not a misconfiguration - so this
      # rule trips RecordingRulesNoData precisely when everything is
      # healthy. Not useful here.
      rules:
        count:up0:
          enabled: false
      groups:
        kube-apiserver-burnrate.rules:
          enabled: false
        kube-apiserver-histogram.rules:
          enabled: false
        kube-apiserver-slos:
          enabled: false
        # Same MetricsQL quirk as count:up0 above: rate() over these
        # scheduler histogram buckets returns no series (not zero) when
        # there's been no scheduling activity in the lookback window,
        # which is most of the time on a quiet single-node home cluster.
        # kube-scheduler itself is scraped fine (up == 1).
        kube-scheduler.rules:
          enabled: false
    kubeEtcd:
      # Talos runs etcd as a native host process, not a labeled Kubernetes
      # pod, so the chart's default component=etcd pod-selector service
      # never matches anything. Point it at the node directly instead.
      #
      # Port 2379 is etcd's mTLS client API - Talos's etcd CA isn't the
      # Kubernetes API server CA, so bearer-token/serviceaccount-CA auth
      # (the chart's default) fails certificate verification against it.
      # Talos machine config already exposes a separate, unauthenticated
      # metrics-only listener on 2381 (etcd.extraArgs.listen-metrics-urls)
      # specifically to avoid needing etcd's own client certs in-cluster.
      endpoints:
        - 192.168.1.75
      service:
        port: 2381
        targetPort: 2381
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              metricRelabelConfigs:
                - action: drop
                  sourceLabels: [__name__]
                  regex: "etcd_.*_bucket"
    # The chart's default kubelet/cadvisor relabeling maps every Kubernetes
    # node label onto every single container-level metric via a blanket
    # labelmap. Talos stamps ~10 verbose extensions.talos.dev/* labels
    # (extension versions, kernel version) on each node, which rides along
    # on every metric this scrapes -- and, worse, on every alert derived
    # from them. alertmanager-ntfy turns all alert labels into ntfy tags
    # unconditionally, so CPUThrottlingHigh (already one of the more
    # label-heavy default alerts) blew past ntfy's 512-byte tag limit and
    # got silently rejected, breaking notification delivery entirely.
    # Dropping these (plus the long-deprecated beta.kubernetes.io/*
    # duplicates of kubernetes.io/arch and kubernetes.io/os) after the
    # labelmap step fixes both the cardinality bloat and the ntfy rejection.
    kubelet:
      vmScrape:
        spec:
          relabelConfigs:
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
            - action: labeldrop
              regex: "extensions_talos_dev_.*|beta_kubernetes_io_.*"
            - sourceLabels: [__metrics_path__]
              targetLabel: metrics_path
            - targetLabel: job
              replacement: kubelet
    vlsingle:
      enabled: true
      spec:
        retentionPeriod: "7d"
        storage:
          resources:
            requests:
              storage: 10Gi
    vlagent:
      enabled: true
    grafana:
      fullnameOverride: grafana
      defaultDashboardsEnabled: true
      plugins:
        - victoriametrics-logs-datasource
