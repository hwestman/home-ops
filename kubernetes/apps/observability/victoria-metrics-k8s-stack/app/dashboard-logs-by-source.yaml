---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logs-by-source-dashboard
  labels:
    grafana_dashboard: "1"
data:
  logs-by-source.json: |
    {
      "title": "Logs Ingested by Source",
      "uid": "logs-by-source",
      "timezone": "browser",
      "schemaVersion": 39,
      "time": { "from": "now-6h", "to": "now" },
      "refresh": "1m",
      "panels": [
        {
          "id": 2,
          "title": "Log volume by container",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "victoriametrics-logs-datasource", "uid": "VictoriaLogs" },
          "targets": [
            {
              "datasource": { "type": "victoriametrics-logs-datasource", "uid": "VictoriaLogs" },
              "refId": "A",
              "queryType": "statsRange",
              "editorMode": "code",
              "expr": "* | stats by (kubernetes.container_name) count() as logs",
              "legendFormat": "{{kubernetes.container_name}}",
              "step": "$__interval"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "stacking": { "mode": "normal" },
                "fillOpacity": 80,
                "lineWidth": 0,
                "pointSize": 0
              },
              "unit": "short"
            }
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["sum"] },
            "tooltip": { "mode": "multi" }
          }
        },
        {
          "id": 4,
          "title": "Log lines by container",
          "type": "piechart",
          "gridPos": { "h": 10, "w": 12, "x": 0, "y": 9 },
          "datasource": { "type": "victoriametrics-logs-datasource", "uid": "VictoriaLogs" },
          "targets": [
            {
              "datasource": { "type": "victoriametrics-logs-datasource", "uid": "VictoriaLogs" },
              "refId": "A",
              "queryType": "stats",
              "editorMode": "code",
              "expr": "* | stats by (kubernetes.container_name) count() as logs",
              "legendFormat": "{{kubernetes.container_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short" }
          },
          "options": {
            "pieType": "pie",
            "reduceOptions": { "calcs": ["lastNotNull"], "values": false },
            "legend": { "displayMode": "table", "placement": "right", "values": ["value", "percent"] },
            "tooltip": { "mode": "single" }
          }
        },
        {
          "id": 5,
          "title": "Containers with most error logs",
          "type": "bargauge",
          "gridPos": { "h": 10, "w": 12, "x": 12, "y": 9 },
          "datasource": { "type": "victoriametrics-logs-datasource", "uid": "VictoriaLogs" },
          "targets": [
            {
              "datasource": { "type": "victoriametrics-logs-datasource", "uid": "VictoriaLogs" },
              "refId": "A",
              "queryType": "stats",
              "editorMode": "code",
              "expr": "(level:~\"(?i)error\" OR _msg:~\"(?i)error\") | stats by (kubernetes.container_name) count() as errors",
              "legendFormat": "{{kubernetes.container_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "color": { "mode": "fixed", "fixedColor": "red" }
            }
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "reduceOptions": { "calcs": ["lastNotNull"], "values": false }
          }
        },
        {
          "id": 6,
          "title": "Containers with most warning logs",
          "type": "bargauge",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 19 },
          "datasource": { "type": "victoriametrics-logs-datasource", "uid": "VictoriaLogs" },
          "targets": [
            {
              "datasource": { "type": "victoriametrics-logs-datasource", "uid": "VictoriaLogs" },
              "refId": "A",
              "queryType": "stats",
              "editorMode": "code",
              "expr": "(level:~\"(?i)warn\" OR _msg:~\"(?i)warn\") | stats by (kubernetes.container_name) count() as warnings",
              "legendFormat": "{{kubernetes.container_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "color": { "mode": "fixed", "fixedColor": "orange" }
            }
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "reduceOptions": { "calcs": ["lastNotNull"], "values": false }
          }
        }
      ]
    }
