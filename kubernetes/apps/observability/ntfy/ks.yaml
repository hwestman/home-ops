---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ntfy
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: ntfy
      namespace: observability
  interval: 1h
  path: ./kubernetes/apps/observability/ntfy/app
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  wait: false
