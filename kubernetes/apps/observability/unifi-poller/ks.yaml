---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: unifi-poller
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: unifi-poller
      namespace: observability
  interval: 1h
  path: ./kubernetes/apps/observability/unifi-poller/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  wait: false
