---
apiVersion: v1
kind: Service
metadata:
  name: snmp-exporter
  labels:
    app: snmp-exporter
spec:
  ports:
    - name: http
      port: 9116
      targetPort: 9116
      protocol: TCP
  selector:
    app: snmp-exporter
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: snmp-conf
data:
  snmp.yml: |
    edgemax:
      walk:
        - 1.3.6.1.2.1.31.1.1.1.10
        - 1.3.6.1.2.1.31.1.1.1.6
        - 1.3.6.1.2.1.2.2.1.2
        - 1.3.6.1.2.1.2.2.1.8
        - 1.3.6.1.2.1.2.2.1.14
        - 1.3.6.1.2.1.2.2.1.20
      get:
        - 1.3.6.1.2.1.25.1.1.0
        - 1.3.6.1.2.1.25.2.2.0
        - 1.3.6.1.4.1.2021.11.11.0
        - 1.3.6.1.4.1.2021.11.9.0
        - 1.3.6.1.4.1.2021.11.10.0
        - 1.3.6.1.4.1.2021.4.11.0
        - 1.3.6.1.4.1.2021.4.15.0
        - 1.3.6.1.4.1.2021.4.5.0
        - 1.3.6.1.4.1.2021.10.1.3.1
        - 1.3.6.1.4.1.2021.10.1.3.2
        - 1.3.6.1.4.1.2021.10.1.3.3
      metrics:
        - name: hrSystemUptime
          oid: 1.3.6.1.2.1.25.1.1
          type: gauge
          help: The amount of time since this host was last initialized
        - name: hrMemorySize
          oid: 1.3.6.1.2.1.25.2.2
          type: gauge
          help: The amount of physical read-write main memory contained by the host
        - name: ifHCOutOctets
          oid: 1.3.6.1.2.1.31.1.1.1.10
          type: counter
          help: The total number of octets transmitted out of the interface
          indexes:
            - labelname: ifIndex
              type: gauge
          lookups:
            - labels: [ifIndex]
              labelname: ifDescr
              oid: 1.3.6.1.2.1.2.2.1.2
              type: DisplayString
        - name: ifHCInOctets
          oid: 1.3.6.1.2.1.31.1.1.1.6
          type: counter
          help: The total number of octets received on the interface
          indexes:
            - labelname: ifIndex
              type: gauge
          lookups:
            - labels: [ifIndex]
              labelname: ifDescr
              oid: 1.3.6.1.2.1.2.2.1.2
              type: DisplayString
        - name: ifOperStatus
          oid: 1.3.6.1.2.1.2.2.1.8
          type: gauge
          help: "Interface operational state: 1=up 2=down 3=testing 4=unknown 5=dormant 6=notPresent 7=lowerLayerDown"
          indexes:
            - labelname: ifIndex
              type: gauge
          lookups:
            - labels: [ifIndex]
              labelname: ifDescr
              oid: 1.3.6.1.2.1.2.2.1.2
              type: DisplayString
        - name: ifInErrors
          oid: 1.3.6.1.2.1.2.2.1.14
          type: counter
          help: The number of inbound packets discarded because of errors
          indexes:
            - labelname: ifIndex
              type: gauge
          lookups:
            - labels: [ifIndex]
              labelname: ifDescr
              oid: 1.3.6.1.2.1.2.2.1.2
              type: DisplayString
        - name: ifOutErrors
          oid: 1.3.6.1.2.1.2.2.1.20
          type: counter
          help: The number of outbound packets that could not be transmitted because of errors
          indexes:
            - labelname: ifIndex
              type: gauge
          lookups:
            - labels: [ifIndex]
              labelname: ifDescr
              oid: 1.3.6.1.2.1.2.2.1.2
              type: DisplayString
        - name: ssCpuIdle
          oid: 1.3.6.1.4.1.2021.11.11
          type: gauge
          help: The percentage of processor time spent idle
        - name: ssCpuUser
          oid: 1.3.6.1.4.1.2021.11.9
          type: gauge
          help: The percentage of processor time spent on user-level processes
        - name: ssCpuSystem
          oid: 1.3.6.1.4.1.2021.11.10
          type: gauge
          help: The percentage of processor time spent on system-level (kernel) processes
        - name: memTotalFree
          oid: 1.3.6.1.4.1.2021.4.11
          type: gauge
          help: The total amount of memory free or available for use on this host
        - name: memCached
          oid: 1.3.6.1.4.1.2021.4.15
          type: gauge
          help: The total amount of real or virtual memory allocated for use as cached memory
        - name: memTotalReal
          oid: 1.3.6.1.4.1.2021.4.5
          type: gauge
          help: The total amount of real/physical memory installed on this host
        - name: laLoad1
          oid: 1.3.6.1.4.1.2021.10.1.3.1
          type: DisplayString
          help: 1 minute load average
          regex_extracts:
            '':
              - regex: '(\d+\.\d+)'
                value: '$1'
        - name: laLoad5
          oid: 1.3.6.1.4.1.2021.10.1.3.2
          type: DisplayString
          help: 5 minute load average
          regex_extracts:
            '':
              - regex: '(\d+\.\d+)'
                value: '$1'
        - name: laLoad15
          oid: 1.3.6.1.4.1.2021.10.1.3.3
          type: DisplayString
          help: 15 minute load average
          regex_extracts:
            '':
              - regex: '(\d+\.\d+)'
                value: '$1'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snmp-exporter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: snmp-exporter
  template:
    metadata:
      labels:
        app: snmp-exporter
    spec:
      containers:
        - name: snmp-exporter
          image: prom/snmp-exporter:v0.20.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/snmp_exporter/snmp.yml
          ports:
            - name: http
              containerPort: 9116
          volumeMounts:
            - name: snmp-conf-volume
              mountPath: /etc/snmp_exporter
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: snmp-conf-volume
          configMap:
            name: snmp-conf
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: edgerouter-snmp
spec:
  jobName: edgerouter-snmp
  targetEndpoints:
    - targets:
        - "192.168.1.1"
      path: /snmp
      params:
        module:
          - edgemax
      relabelConfigs:
        - sourceLabels: [__address__]
          targetLabel: __param_target
        - sourceLabels: [__param_target]
          targetLabel: instance
        - targetLabel: __address__
          replacement: snmp-exporter.observability.svc.cluster.local:9116
