---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edgerouter-dashboard
  labels:
    grafana_dashboard: "1"
data:
  edgerouter.json: |
    {
      "title": "EdgeRouter",
      "uid": "edgerouter-snmp",
      "timezone": "browser",
      "schemaVersion": 39,
      "time": { "from": "now-6h", "to": "now" },
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "CPU Idle",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "targets": [
            { "expr": "ssCpuIdle{instance=\"192.168.1.1\"}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 20 },
                  { "color": "green", "value": 50 }
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "title": "Memory Used",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "targets": [
            {
              "expr": "100 * (1 - (memTotalFree{instance=\"192.168.1.1\"} / hrMemorySize{instance=\"192.168.1.1\"}))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              }
            }
          }
        },
        {
          "id": 3,
          "title": "Uptime",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "targets": [
            { "expr": "hrSystemUptime{instance=\"192.168.1.1\"} / 100", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 4,
          "title": "Memory Total / Free / Cached",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "targets": [
            { "expr": "hrMemorySize{instance=\"192.168.1.1\"} * 1024", "legendFormat": "Total", "refId": "A" },
            { "expr": "memTotalFree{instance=\"192.168.1.1\"} * 1024", "legendFormat": "Free", "refId": "B" },
            { "expr": "memCached{instance=\"192.168.1.1\"} * 1024", "legendFormat": "Cached", "refId": "C" }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "id": 5,
          "title": "Interface Traffic (all ifIndex)",
          "type": "timeseries",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "targets": [
            {
              "expr": "rate(ifHCInOctets{instance=\"192.168.1.1\"}[5m]) * 8",
              "legendFormat": "in ifIndex={{ifIndex}}",
              "refId": "A"
            },
            {
              "expr": "rate(ifHCOutOctets{instance=\"192.168.1.1\"}[5m]) * 8 * -1",
              "legendFormat": "out ifIndex={{ifIndex}}",
              "refId": "B"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bps" } }
        }
      ]
    }
