---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edgerouter-dashboard
  labels:
    grafana_dashboard: "1"
data:
  edgerouter.json: |
    {
      "title": "EdgeRouter",
      "uid": "edgerouter-snmp",
      "timezone": "browser",
      "schemaVersion": 39,
      "time": { "from": "now-6h", "to": "now" },
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "CPU Idle",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "targets": [
            { "expr": "ssCpuIdle{instance=\"192.168.1.1\"}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 20 },
                  { "color": "green", "value": 50 }
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "title": "Memory Used",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "targets": [
            {
              "expr": "100 * (1 - (memTotalFree{instance=\"192.168.1.1\"} / hrMemorySize{instance=\"192.168.1.1\"}))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              }
            }
          }
        },
        {
          "id": 3,
          "title": "Uptime",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "targets": [
            { "expr": "hrSystemUptime{instance=\"192.168.1.1\"} / 100", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 4,
          "title": "Memory Total / Free / Cached",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "targets": [
            { "expr": "hrMemorySize{instance=\"192.168.1.1\"} * 1024", "legendFormat": "Total", "refId": "A" },
            { "expr": "memTotalFree{instance=\"192.168.1.1\"} * 1024", "legendFormat": "Free", "refId": "B" },
            { "expr": "memCached{instance=\"192.168.1.1\"} * 1024", "legendFormat": "Cached", "refId": "C" }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "id": 5,
          "title": "Interface Traffic",
          "type": "timeseries",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "targets": [
            {
              "expr": "rate(ifHCInOctets{instance=\"192.168.1.1\"}[5m]) * 8",
              "legendFormat": "in {{ifDescr}}",
              "refId": "A"
            },
            {
              "expr": "rate(ifHCOutOctets{instance=\"192.168.1.1\"}[5m]) * 8 * -1",
              "legendFormat": "out {{ifDescr}}",
              "refId": "B"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bps" } }
        },
        {
          "id": 6,
          "title": "Interface Status",
          "type": "state-timeline",
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 18 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "targets": [
            {
              "expr": "ifOperStatus{instance=\"192.168.1.1\"}",
              "legendFormat": "{{ifDescr}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": { "text": "Up", "color": "green" },
                    "2": { "text": "Down", "color": "red" }
                  }
                }
              ]
            }
          },
          "options": { "mergeValues": true }
        },
        {
          "id": 7,
          "title": "Interface Errors",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "targets": [
            {
              "expr": "rate(ifInErrors{instance=\"192.168.1.1\"}[5m])",
              "legendFormat": "in {{ifDescr}}",
              "refId": "A"
            },
            {
              "expr": "rate(ifOutErrors{instance=\"192.168.1.1\"}[5m]) * -1",
              "legendFormat": "out {{ifDescr}}",
              "refId": "B"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "pps" } }
        },
        {
          "id": 8,
          "title": "CPU Breakdown",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 32 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "targets": [
            { "expr": "ssCpuUser{instance=\"192.168.1.1\"}", "legendFormat": "user", "refId": "A" },
            { "expr": "ssCpuSystem{instance=\"192.168.1.1\"}", "legendFormat": "system", "refId": "B" },
            { "expr": "ssCpuIdle{instance=\"192.168.1.1\"}", "legendFormat": "idle", "refId": "C" }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 } },
          "options": { "stacking": { "mode": "normal" } }
        },
        {
          "id": 9,
          "title": "Load Average",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 32 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "targets": [
            { "expr": "laLoad1{instance=\"192.168.1.1\"}", "legendFormat": "1m", "refId": "A" },
            { "expr": "laLoad5{instance=\"192.168.1.1\"}", "legendFormat": "5m", "refId": "B" },
            { "expr": "laLoad15{instance=\"192.168.1.1\"}", "legendFormat": "15m", "refId": "C" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "min": 0 } }
        }
      ]
    }
