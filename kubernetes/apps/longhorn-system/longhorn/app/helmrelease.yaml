---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  interval: 1h
  chart:
    spec:
      chart: longhorn
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: longhorn-system
  values:
    defaultSettings:
      # Second physical disk on w11-1, claimed via a Talos UserVolumeConfig
      # (see talos/all/72-longhorn-disk.yaml.tpl) — keeps Longhorn data off
      # the OS disk.
      defaultDataPath: /var/mnt/longhorn
    # Cloudflare R2 (S3-compatible), offsite backup target - the old
    # cluster's NAS backup target is down/possibly dead, so this remains
    # the real safety net even now that in-cluster replicas exist. Region is a
    # required but meaningless placeholder for R2 - "auto" is Cloudflare's
    # own convention. Only specific volumes back up here (see
    # recurringjob-backup.yaml), not everything - large, re-derivable data
    # like Frigate's camera footage is deliberately excluded.
    # NOTE: this belongs under defaultBackupStore, NOT defaultSettings -
    # the chart's default-resource.yaml template only reads
    # .Values.defaultBackupStore.*; defaultSettings.backupTarget is not a
    # recognized key and silently does nothing. (Originally misplaced
    # here 2026-09-16; caught and fixed same day.)
    defaultBackupStore:
      backupTarget: s3://longhorn-backup@auto/
      backupTargetCredentialSecret: longhorn-r2-backup
    persistence:
      # local-path-provisioner stays the cluster default (non-critical data);
      # apps needing real persistence opt in via storageClassName: longhorn.
      defaultClass: false
      # w11-1/w11-2/w11-3 all now have a dedicated Longhorn disk, so new
      # volumes get 2-way redundancy by default. Existing volumes were
      # bumped from 1 -> 2 directly (spec.numberOfReplicas), live, no data
      # migration - this setting only governs volumes created from here on.
      defaultClassReplicaCount: 2
