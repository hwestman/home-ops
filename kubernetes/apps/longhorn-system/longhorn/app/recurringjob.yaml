---
# Longhorn doesn't reclaim space from deleted blocks by default
# (unmapMarkSnapChainRemoved: ignored). Workloads with heavy write+delete
# churn - like frigate rotating video footage - end up with actualSize
# climbing toward the volume's capacity even though live data stays small,
# eventually causing real write failures once actualSize hits the cap.
#
# A volume implicitly belongs to the "default" recurring-job group only
# as long as it has no OTHER explicit recurring-job-group label - adding
# any other group (e.g. offsite-backup) silently opts it out of "default"
# too, unless recurring-job-group.longhorn.io/default: enabled is also set
# explicitly. Found 2026-10-13: every backed-up PVC (mariadb,
# home-assistant-pvc, esphome-pvc, home-assistant-hytta-pvc, unifi-data,
# frigate-config, mosquitto-pvc, hermes-pvc - see recurringjob-backup.yaml)
# had fallen out of this group for exactly that reason and was never being
# trimmed, so their Longhorn "actual size" only ever grew. Fixed by adding
# the default label explicitly alongside offsite-backup on each PVC.
# frigate-media carries no labels at all, so it gets "default" purely
# implicitly.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: frigate-trim
  namespace: longhorn-system
spec:
  task: "filesystem-trim"
  cron: "0 3 * * *"
  groups: ["default"]
  retain: 1
  concurrency: 1
