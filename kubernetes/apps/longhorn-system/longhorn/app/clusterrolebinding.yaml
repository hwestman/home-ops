---
# The Helm-managed ClusterRoleBinding "longhorn-bind" binds longhorn-role to
# default:longhorn-service-account, because the longhorn HelmRelease object
# itself lives in the default namespace even though targetNamespace deploys
# everything else into longhorn-system. That's what the chart templated
# .Release.Namespace against. The actual longhorn-manager/CSI pods run as
# longhorn-system:longhorn-service-account, which as a result has none of
# these permissions - breaking new volume provisioning and RecurringJobs.
#
# This is additive only (doesn't touch the Helm-managed binding or move the
# release) until the HelmRelease namespace mismatch is fixed properly.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: longhorn-bind-longhorn-system
subjects:
  - kind: ServiceAccount
    name: longhorn-service-account
    namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: longhorn-role
