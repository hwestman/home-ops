---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant-hytta
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Home Assistant (Hytta)"
    gethomepage.dev/description: "Home automation - cabin"
    gethomepage.dev/group: "Home"
    gethomepage.dev/icon: "home-assistant.svg"
    gethomepage.dev/pod-selector: "app=home-assistant-hytta"
spec:
  hostnames:
    - "hytta.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: home-assistant-hytta
          port: 8123
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hytta-code
spec:
  hostnames:
    - "hytta-code.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: home-assistant-hytta
          port: 8080
