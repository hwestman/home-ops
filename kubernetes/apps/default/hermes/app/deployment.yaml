---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      serviceAccountName: hermes
      initContainers:
        # The hermes-agent image doesn't bundle kubectl - fetch a pinned
        # binary (matching the cluster's actual v1.37.1 server, not left
        # stale) straight from the official Kubernetes release server into
        # a shared emptyDir, so the gateway container's
        # `terminal`/`code_execution` tools can call it directly.
        # bitnami/kubectl's free tags were discontinued (2026-10-08: only
        # digest/"latest" tags exist now). rancher/kubectl has versioned
        # tags but turned out to be a shell-less distroless image ("sh":
        # executable file not found) - can't exec a copy command inside it.
        # curlimages/curl (alpine-based, has a real shell) pulling straight
        # from dl.k8s.io avoids depending on any third party's repackaging.
        - name: kubectl-init
          image: curlimages/curl:8.22.0
          command:
            - sh
            - -c
            - curl -fL -o /shared-bin/kubectl https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl && chmod +x /shared-bin/kubectl
          volumeMounts:
            - name: kubectl-bin
              mountPath: /shared-bin
      containers:
        - name: gateway
          image: nousresearch/hermes-agent:v2026.9.24
          imagePullPolicy: IfNotPresent
          # Don't set `command:` — that overrides the image's ENTRYPOINT
          # (/init, s6-overlay's PID 1, which does the HERMES_UID/GID
          # remap and starts the supervision tree). `args` alone mirrors
          # docker-compose's `command: ["gateway", "run"]`, which only
          # overrides CMD.
          args:
            - gateway
            - run
          env:
            - name: TZ
              value: Europe/Oslo
            - name: HERMES_UID
              value: "1000"
            - name: HERMES_GID
              value: "1000"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: OPENROUTER_API_KEY
            - name: HASS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: HASS_TOKEN
            - name: HASS_URL
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: HASS_URL
            - name: KUBECONFIG
              value: /opt/kube/config
            # Prepend, don't replace - the image's own PATH (verified live,
            # not guessed) includes /opt/hermes/bin and /opt/hermes/.venv/bin,
            # where `hermes` and `python3` themselves live. A naive PATH
            # override here would've broken the hermes CLI entirely.
            - name: PATH
              value: /opt/kube/bin:/opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: kubectl-bin
              mountPath: /opt/kube/bin
            - name: kubeconfig
              mountPath: /opt/kube/config
              subPath: config
              readOnly: true
        - name: dashboard
          image: nousresearch/hermes-agent:v2026.9.24
          imagePullPolicy: IfNotPresent
          args:
            - dashboard
            - --host
            - 127.0.0.1
            - --no-open
          env:
            - name: TZ
              value: Europe/Oslo
            - name: HERMES_UID
              value: "1000"
            - name: HERMES_GID
              value: "1000"
          ports:
            - containerPort: 9119
              name: dashboard
              protocol: TCP
          # tcpSocket probes connect via the Pod IP, which can never reach
          # a listener bound to 127.0.0.1 only (deliberate — see the
          # --host 127.0.0.1 arg above) — that crash-looped this container
          # on liveness failures. exec runs inside the container's own
          # netns instead, so it can actually reach loopback.
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - "import socket; socket.create_connection(('127.0.0.1', 9119), 2).close()"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - "import socket; socket.create_connection(('127.0.0.1', 9119), 2).close()"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-pvc
        - name: kubectl-bin
          emptyDir: {}
        - name: kubeconfig
          configMap:
            name: hermes-kubeconfig
