---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unifi
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "UniFi"
    gethomepage.dev/description: "UniFi Network Controller"
    gethomepage.dev/group: "Network"
    gethomepage.dev/icon: "unifi.svg"
    gethomepage.dev/pod-selector: "app=unifi"
spec:
  hostnames:
    - "unifi.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: unifi
          port: 8443
