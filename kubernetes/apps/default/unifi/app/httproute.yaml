---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unifi
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "UniFi"
    gethomepage.dev/description: "UniFi Network Controller"
    gethomepage.dev/group: "Network"
    gethomepage.dev/icon: "unifi.svg"
    gethomepage.dev/pod-selector: "app=unifi"
    gethomepage.dev/widget.type: "unifi"
    gethomepage.dev/widget.url: "https://unifi.default.svc.cluster.local:8443"
    gethomepage.dev/widget.username: "{{HOMEPAGE_VAR_UNIFI_USERNAME}}"
    gethomepage.dev/widget.password: "{{HOMEPAGE_VAR_UNIFI_PASSWORD}}"
    gethomepage.dev/widget.fields: '["uptime", "wan", "lan_users", "wlan_users"]'
spec:
  hostnames:
    - "unifi.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: unifi
          port: 8443
