---
apiVersion: v1
kind: Service
metadata:
  name: unifi
  annotations:
    # Pins the same IP the old MetalLB-backed service used, so device
    # inform URLs (http://192.168.1.222:8080/inform) never had to change.
    lbipam.cilium.io/ips: "192.168.1.222"
  labels:
    app: unifi
spec:
  type: LoadBalancer
  # externalTrafficPolicy: Local (removed 2026-09-22) required the Cilium
  # L2-announcement leader for 192.168.1.222 to always be the same node
  # running the unifi pod, but leader election doesn't account for backend
  # locality - about 2 times out of 3 it picked a node with no local pod,
  # silently black-holing all inform traffic (APs/switches stuck
  # "Unreachable" until the lease happened to land right). Default
  # (Cluster) policy lets any node forward correctly regardless of which
  # node holds the L2 lease. This only affects the source IP the
  # controller sees on each device's own inform connection (cosmetic - the
  # devices' IPs are already static/known); wireless client tracking data
  # comes from each AP's self-reported station table in the inform
  # payload, unaffected by NAT.
  ports:
    - name: inform
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: stun
      port: 3478
      targetPort: 3478
      protocol: UDP
    - name: portal
      port: 8880
      targetPort: 8880
      protocol: TCP
    - name: speedtest
      port: 6789
      targetPort: 6789
      protocol: TCP
    - name: webui
      port: 8443
      targetPort: 8443
      protocol: TCP
  selector:
    app: unifi
