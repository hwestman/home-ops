---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: unifi
  template:
    metadata:
      labels:
        app: unifi
    spec:
      # Image runs as uid/gid 999; the Longhorn volume mounts root-owned
      # otherwise, and the controller fails to write to /unifi on first boot.
      securityContext:
        fsGroup: 999
      containers:
        # Migrated in at v7.4.162 (matching the old j-burg11 cluster's
        # controller, for a clean backup restore) then staged forward to
        # latest one checkpoint at a time -- Ubiquiti gates upgrades to
        # specific versions, so a direct jump isn't supported. Chain used:
        # 7.4.162 -> 7.5.176 -> 8.0.28 -> 8.1.113 -> 8.2.93 -> 8.3.32 ->
        # 8.4.62 -> 8.5.6 -> 8.6.9 -> 9.3.45 (skips 9.0-9.2, a confirmed
        # direct-upgrade target from 8.6.9) -> 9.4.19 -> 9.5.21 -> 10.0.162.
        - name: unifi
          image: jacobalberty/unifi:v10.0.162
          imagePullPolicy: IfNotPresent
          env:
            # Replaces Tomcat's self-signed cert with the cert-manager one so
            # Envoy Gateway's BackendTLSPolicy can validate it against the
            # public Let's Encrypt root instead of needing a custom CA bundle.
            - name: CERTDIR
              value: /unifi/cert
            - name: CERTNAME
              value: cert.pem
            - name: CERT_PRIVATE_NAME
              value: privkey.pem
            - name: CERT_IS_CHAIN
              value: "true"
          resources:
            requests:
              memory: "768Mi"
              cpu: "250m"
            limits:
              # Default JVM_MAX_HEAP_SIZE is 1024M -- a 1Gi container limit
              # leaves no room for metaspace/off-heap, the embedded MongoDB
              # process, or OS overhead. 2Gi gives real headroom.
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /status
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /status
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - mountPath: /unifi
              name: unifi-data
            - mountPath: /unifi/cert
              name: unifi-cert
      volumes:
        - name: unifi-data
          persistentVolumeClaim:
            claimName: unifi-data
        - name: unifi-cert
          secret:
            secretName: unifi-tls
            items:
              - key: tls.crt
                path: cert.pem
              - key: tls.key
                path: privkey.pem
              # This cert-manager/issuer combination doesn't populate a
              # separate ca.crt; tls.crt already bundles leaf+intermediate,
              # so project it again as the chain.pem the import script
              # unconditionally expects to find alongside cert.pem.
              - key: tls.crt
                path: chain.pem
