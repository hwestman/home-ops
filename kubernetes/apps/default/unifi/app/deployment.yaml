---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: unifi
  template:
    metadata:
      labels:
        app: unifi
    spec:
      # Image runs as uid/gid 999; the Longhorn volume mounts root-owned
      # otherwise, and the controller fails to write to /unifi on first boot.
      securityContext:
        fsGroup: 999
      containers:
        # Pinned to the exact version confirmed running on the old cluster's
        # controller (j-burg11, checked via its /status endpoint) so the
        # restored backup loads cleanly. Stage upgrades forward from here
        # afterward -- Ubiquiti gates upgrades to specific version
        # checkpoints, so don't jump straight to latest.
        - name: unifi
          image: jacobalberty/unifi:v9.4.19
          imagePullPolicy: IfNotPresent
          env:
            # Replaces Tomcat's self-signed cert with the cert-manager one so
            # Envoy Gateway's BackendTLSPolicy can validate it against the
            # public Let's Encrypt root instead of needing a custom CA bundle.
            - name: CERTDIR
              value: /unifi/cert
            - name: CERTNAME
              value: cert.pem
            - name: CERT_PRIVATE_NAME
              value: privkey.pem
            - name: CERT_IS_CHAIN
              value: "true"
          resources:
            requests:
              memory: "768Mi"
              cpu: "250m"
            limits:
              # Default JVM_MAX_HEAP_SIZE is 1024M -- a 1Gi container limit
              # leaves no room for metaspace/off-heap, the embedded MongoDB
              # process, or OS overhead. 2Gi gives real headroom.
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /status
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /status
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - mountPath: /unifi
              name: unifi-data
            - mountPath: /unifi/cert
              name: unifi-cert
      volumes:
        - name: unifi-data
          persistentVolumeClaim:
            claimName: unifi-data
        - name: unifi-cert
          secret:
            secretName: unifi-tls
            items:
              - key: tls.crt
                path: cert.pem
              - key: tls.key
                path: privkey.pem
              # This cert-manager/issuer combination doesn't populate a
              # separate ca.crt; tls.crt already bundles leaf+intermediate,
              # so project it again as the chain.pem the import script
              # unconditionally expects to find alongside cert.pem.
              - key: tls.crt
                path: chain.pem
