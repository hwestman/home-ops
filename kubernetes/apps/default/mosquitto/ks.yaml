---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mosquitto
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: mosquitto
      namespace: default
  interval: 1h
  path: ./kubernetes/apps/default/mosquitto/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
