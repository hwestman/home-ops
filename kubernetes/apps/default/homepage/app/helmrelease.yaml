---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
spec:
  chartRef:
    kind: OCIRepository
    name: homepage
  interval: 1h
  values:
    controllers:
      homepage:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.3.0
            env:
              HOMEPAGE_ALLOWED_HOSTS: "${SECRET_DOMAIN},homepage.${SECRET_DOMAIN}"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthcheck
                    port: &port 3000
                    httpHeaders:
                      - name: Host
                        value: "homepage.${SECRET_DOMAIN}"
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        ports:
          http:
            port: *port
    defaultPodOptions:
      automountServiceAccountToken: true
    route:
      app:
        kind: HTTPRoute
        hostnames:
          - "homepage.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
      external:
        kind: HTTPRoute
        hostnames:
          - "${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
    serviceAccount:
      homepage:
        automountServiceAccountToken: true
    # Read-only access so the Kubernetes/Gateway API service discovery
    # (kubernetes.yaml: mode: cluster) can populate the dashboard from
    # gethomepage.dev/* annotations on Services/HTTPRoutes cluster-wide.
    rbac:
      roles:
        homepage:
          type: ClusterRole
          rules:
            - apiGroups: [""]
              resources: ["namespaces", "pods", "nodes", "services"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["extensions", "networking.k8s.io"]
              resources: ["ingresses"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["gateway.networking.k8s.io"]
              resources: ["httproutes", "gateways"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["metrics.k8s.io"]
              resources: ["nodes", "pods"]
              verbs: ["get", "list", "watch"]
      bindings:
        homepage:
          type: ClusterRoleBinding
          roleRef:
            identifier: homepage
          subjects:
            - identifier: homepage
    configMaps:
      config:
        data:
          settings.yaml: |
            title: Homelab
            providers:
              longhorn:
                url: http://longhorn-frontend.longhorn-system.svc.cluster.local
          bookmarks.yaml: |
            - Links:
                - GitHub:
                    - icon: github.svg
                      href: https://github.com/
                - Cloudflare:
                    - icon: cloudflare.svg
                      href: https://dash.cloudflare.com/
          services.yaml: |
            - Network:
                - Edgerouter4:
                    icon: mdi-router-network
                    href: http://192.168.1.1/
                    description: 192.168.1.1
            - Home:
                - Zigbee2MQTT:
                    icon: zigbee2mqtt.svg
                    href: http://192.168.1.56:8080/
                    description: Zigbee network coordinator
                - ZWaveJS-UI:
                    icon: z-wave-js-ui.svg
                    href: http://192.168.1.157:8091/#/
                    description: Z-Wave network coordinator
          widgets.yaml: |
            - kubernetes:
                cluster:
                  show: true
                  cpu: true
                  memory: true
                  showLabel: true
                  label: "cluster"
                nodes:
                  show: true
                  cpu: true
                  memory: true
                  showLabel: true
            - longhorn:
                expanded: true
                total: true
                labels: true
                nodes: true
            - search:
                provider: duckduckgo
                target: _blank
          kubernetes.yaml: |
            mode: cluster
            gateway: true
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /app/config/settings.yaml
            subPath: settings.yaml
          - path: /app/config/bookmarks.yaml
            subPath: bookmarks.yaml
          - path: /app/config/services.yaml
            subPath: services.yaml
          - path: /app/config/widgets.yaml
            subPath: widgets.yaml
          - path: /app/config/kubernetes.yaml
            subPath: kubernetes.yaml
