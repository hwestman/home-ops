---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frigate-config
data:
  config.yml: |
    mqtt:
      enabled: true
      host: mosquitto.default.svc.cluster.local
      port: 1883
      user: frigate
      password: "{FRIGATE_MQTT_PASSWORD}"

    detectors:
      onnx:
        type: onnx

    model:
      model_type: yolo-generic
      # Upgraded from yolov9-t (tiny) to yolov9-s (small) @ 320px
      # (2026-10-08) - GPU was sitting at ~5% util / 4.37ms inference with
      # the tiny model, so there was plenty of headroom for a more accurate
      # variant at no real cost. Exported the same way as the original
      # model (one-off Job, see git history), following Frigate's own
      # documented yolov9 ONNX export process. Old yolo.onnx left in place
      # on the PVC as an instant rollback if accuracy/perf regresses.
      path: /config/model_cache/yolov9-s-320.onnx
      labelmap_path: /labelmap/coco-80.txt
      input_tensor: nchw
      input_dtype: float
      width: 320
      height: 320

    ffmpeg:
      hwaccel_args: preset-nvidia
      # Default record preset (preset-record-generic) strips audio
      # entirely. Both driveway and washroom sources are already AAC, so
      # copy rather than re-encode. garage has no audio track - this is a
      # harmless no-op there.
      output_args:
        record: preset-record-generic-audio-copy

    # go2rtc restream - required for the Live view to use MSE (native
    # resolution/fps + audio) instead of the video-only jsmpeg fallback.
    # driveway and washroom both have AAC audio tracks (verified via
    # ffprobe), directly MSE-compatible with no transcoding needed. garage
    # has no audio track at all, so it's left off this list. washroom's
    # main stream is H.265, which most browsers can't play live - using
    # the H.264 substream here instead (recording still uses the H.265
    # main stream via the camera's own ffmpeg input below).
    go2rtc:
      streams:
        driveway:
          - rtsp://192.168.1.161:554/s0
        washroom:
          - rtsp://admin:{FRIGATE_WASHROOM_PASSWORD}@192.168.2.118:554/cam/realmonitor?channel=1&subtype=1

    detect:
      enabled: true

    record:
      enabled: true
      # No independent motion-based retention (default: 0 days) - only
      # footage tied to an actual alert/detection review item is kept.
      # This was previously set to 7 days and was filling the 40Gi media
      # PVC in ~1 day, since Frigate's default motion sensitivity treats
      # nearly all outdoor activity (trees, headlights, traffic) as
      # "motion" independent of whether an object was ever recognized.
      alerts:
        retain:
          days: 30
          # active_objects, not motion (2026-10-09): mode only controls
          # trimming *within* an already-created alert/detection clip -
          # review items themselves already require a tracked object, so
          # this was never "a clip for every motion event." But `motion`
          # mode keeps any sub-segment with motion OR audio even once the
          # object is gone (record/maintainer.py SegmentInfo.
          # should_discard_segment) - e.g. leaves blowing after a car
          # leaves frame stays in the clip. `active_objects` keeps only
          # segments where a tracked object was actually present.
          mode: active_objects
      detections:
        retain:
          # Was 0 days - harmless before (only `person` was tracked, and
          # it's also an alert label, so nothing ever landed detections-
          # only). Now that most of driveway's tracked labels (dog, cat,
          # bird, bicycle, motorcycle, snowboard, skis, potted plant,
          # bottle, pizza, book) aren't in alerts.labels ([person, car]
          # default), they're detections-tier only - 0 days would delete
          # those clips almost immediately. Matched to alerts' 30 days;
          # active_objects mode (above) already keeps these trimmed to
          # just the object-present segments, so storage impact is low.
          days: 30
          mode: active_objects

    cameras:
      driveway:
        ffmpeg:
          inputs:
            - path: rtsp://192.168.1.161:554/s0
              roles:
                - record
            - path: rtsp://192.168.1.161:554/s1
              roles:
                - detect
        detect:
          width: 640
          height: 360
        # No continuous recording - motion-only (inherits the global
        # record.motion block above).
        objects:
          # Frigate's objects.track defaults to ["person"] only (frigate/
          # config/camera/objects.py DEFAULT_TRACKED_OBJECTS) - car/dog/cat
          # were never tracked here despite being in the coco-80 labelmap.
          # car lands as an alert automatically (review.alerts.labels
          # defaults to [person, car]); dog/cat show as detections tier
          # unless added to alerts.labels too.
          track:
            - person
            - car
            - dog
            - cat
            - bird
            - bicycle
            - motorcycle
            - snowboard
            - skis
            - potted plant
            - bottle
            - pizza
            - book
      garage:
        ffmpeg:
          inputs:
            - path: rtsp://192.168.1.103:8554/unicast
              roles:
                - detect
                - record
        detect:
          width: 1920
          height: 1080
        # No continuous recording - motion-only (inherits the global
        # record.motion block above).
        # record.enabled must start true (inherited from global) - Frigate's
        # MQTT recordings/set command hard-refuses to turn recording ON if
        # it started disabled in config (frigate.comms.dispatcher checks
        # record.enabled_in_config, which is a one-time snapshot of this
        # value taken at startup; only OFF has no such guard). So the
        # "Frigate-opptak kun når borte" HA automation, which toggles
        # switch.garage_recordings based on people_home, can only ever turn
        # recording off, never on, unless it starts on here. Confirmed
        # 2026-09-29 after a full day of starting false silently failing to
        # ever record - zero clips despite the automation running and
        # switch.turn_on reporting success (HA-side) every time. This does mean
        # a broken/offline automation fails open (records while people are
        # home) rather than closed - that's forced by Frigate, not a choice.
      washroom:
        ffmpeg:
          inputs:
            # Only the substream is pulled - it's what recording, detect, and
            # audio all use here. Carries an AAC audio track (verified via
            # go2rtc), reused for audio event detection - no separate audio
            # stream needed.
            - path: rtsp://admin:{FRIGATE_WASHROOM_PASSWORD}@192.168.2.118:554/cam/realmonitor?channel=1&subtype=1
              roles:
                - detect
                - audio
                - record
        audio:
          enabled: true
          listen:
            - bark
          # Default threshold (0.8) was too high - every bark event ever
          # logged here scored 0.80-0.85, right at that edge (confirmed via
          # /api/events, 2026-10-09), meaning most actual barks were
          # scoring just under 0.8 and never creating an event at all.
          # Lowered to let quieter/less-confident barks through.
          filters:
            bark:
              threshold: 0.6
        detect:
          width: 640
          height: 480
        objects:
          # No visual objects tracked at all (2026-10-13) - person for
          # privacy (this room gets real human presence during laundry,
          # unlike driveway/garage), dog dropped too since the only reason
          # it was ever detected was the old person-misclassification
          # workaround (now removed - nothing left to misclassify it as).
          # Bark (audio) is the only thing this room alerts/records on now.
          track: []
        # Recording enabled (was off entirely) - this is the laundry/dog
        # room, not a bathroom. bark is promoted to the alerts tier (not
        # detections) so it actually surfaces as an alert.
        review:
          alerts:
            labels:
              - bark
          detections:
            labels: []
        # enabled must start true - see garage's comment above for why (the
        # MQTT recordings/set command can only ever turn this off, never on,
        # if it starts false). This does weaken the "person" retention
        # tradeoff noted above: recording is on by default now, not only
        # while away, so a broken/offline "Frigate-opptak kun når borte"
        # automation means plain presence in the room gets recorded even
        # when people are home, not just when unexpected. Accepted as the
        # lesser problem vs. the feature not working at all (2026-09-29).
        record:
          enabled: true
          alerts:
            retain:
              days: 14
              # mode: all, not global default "active_objects" - bark is
              # audio-only with no pixel motion or tracked object, so
              # active_objects mode (which only keeps object-present
              # segments) would trim these clips to nothing.
              mode: all
