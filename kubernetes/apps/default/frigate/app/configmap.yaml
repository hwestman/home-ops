---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frigate-config
data:
  config.yml: |
    mqtt:
      enabled: true
      host: mosquitto.default.svc.cluster.local
      port: 1883
      user: frigate
      password: "{FRIGATE_MQTT_PASSWORD}"

    detectors:
      onnx:
        type: onnx

    model:
      model_type: yolo-generic
      path: /config/model_cache/yolo.onnx
      labelmap_path: /labelmap/coco-80.txt
      input_tensor: nchw
      input_dtype: float
      width: 320
      height: 320

    ffmpeg:
      hwaccel_args: preset-nvidia
      # Default record preset (preset-record-generic) strips audio
      # entirely. Both driveway and washroom sources are already AAC, so
      # copy rather than re-encode. garage has no audio track - this is a
      # harmless no-op there.
      output_args:
        record: preset-record-generic-audio-copy

    # go2rtc restream - required for the Live view to use MSE (native
    # resolution/fps + audio) instead of the video-only jsmpeg fallback.
    # driveway and washroom both have AAC audio tracks (verified via
    # ffprobe), directly MSE-compatible with no transcoding needed. garage
    # has no audio track at all, so it's left off this list. washroom's
    # main stream is H.265, which most browsers can't play live - using
    # the H.264 substream here instead (recording still uses the H.265
    # main stream via the camera's own ffmpeg input below).
    go2rtc:
      streams:
        driveway:
          - rtsp://192.168.1.161:554/s0
        washroom:
          - rtsp://admin:{FRIGATE_WASHROOM_PASSWORD}@192.168.2.118:554/cam/realmonitor?channel=1&subtype=1

    detect:
      enabled: true

    record:
      enabled: true
      # No independent motion-based retention (default: 0 days) - only
      # footage tied to an actual alert/detection review item is kept.
      # This was previously set to 7 days and was filling the 40Gi media
      # PVC in ~1 day, since Frigate's default motion sensitivity treats
      # nearly all outdoor activity (trees, headlights, traffic) as
      # "motion" independent of whether an object was ever recognized.
      alerts:
        retain:
          days: 30
          mode: motion
      detections:
        retain:
          days: 0
          mode: motion

    cameras:
      driveway:
        ffmpeg:
          inputs:
            - path: rtsp://192.168.1.161:554/s0
              roles:
                - record
            - path: rtsp://192.168.1.161:554/s1
              roles:
                - detect
        detect:
          width: 640
          height: 360
        # No continuous recording - motion-only (inherits the global
        # record.motion block above).
      garage:
        ffmpeg:
          inputs:
            - path: rtsp://192.168.1.103:8554/unicast
              roles:
                - detect
                - record
        detect:
          width: 1920
          height: 1080
        # No continuous recording - motion-only (inherits the global
        # record.motion block above).
        # record.enabled must start true (inherited from global) - Frigate's
        # MQTT recordings/set command hard-refuses to turn recording ON if
        # it started disabled in config (frigate.comms.dispatcher checks
        # record.enabled_in_config, which is a one-time snapshot of this
        # value taken at startup; only OFF has no such guard). So the
        # "Frigate-opptak kun når borte" HA automation, which toggles
        # switch.garage_recordings based on people_home, can only ever turn
        # recording off, never on, unless it starts on here. Confirmed
        # 2026-09-29 after a full day of starting false silently failing to
        # ever record - zero clips despite the automation running and
        # switch.turn_on reporting success (HA-side) every time. This does mean
        # a broken/offline automation fails open (records while people are
        # home) rather than closed - that's forced by Frigate, not a choice.
      washroom:
        ffmpeg:
          inputs:
            # Only the substream is pulled - it's what recording, detect, and
            # audio all use here. Carries an AAC audio track (verified via
            # go2rtc), reused for audio event detection - no separate audio
            # stream needed.
            - path: rtsp://admin:{FRIGATE_WASHROOM_PASSWORD}@192.168.2.118:554/cam/realmonitor?channel=1&subtype=1
              roles:
                - detect
                - audio
                - record
        audio:
          enabled: true
          listen:
            - bark
        detect:
          width: 640
          height: 480
        # Recording enabled (was off entirely) - this is the laundry/dog
        # room, not a bathroom. Scoped to bark + person so nothing else
        # creates a review item: review.alerts.labels is emptied out to stop
        # any other visual object (the dog itself, etc.) from ever being
        # reviewed/retained in this room. A label matching neither list gets
        # no review item at all, so it just falls off the ~60s rolling
        # buffer (expire_interval) unretained.
        review:
          alerts:
            labels: []
          detections:
            labels:
              - bark
              - person
        # enabled must start true - see garage's comment above for why (the
        # MQTT recordings/set command can only ever turn this off, never on,
        # if it starts false). This does weaken the "person" retention
        # tradeoff noted above: recording is on by default now, not only
        # while away, so a broken/offline "Frigate-opptak kun når borte"
        # automation means plain presence in the room gets recorded even
        # when people are home, not just when unexpected. Accepted as the
        # lesser problem vs. the feature not working at all (2026-09-29).
        record:
          enabled: true
          detections:
            retain:
              days: 14
              # mode: all, not global default "motion" - bark is audio-only
              # and often has no pixel motion, so "motion" mode trimmed bark
              # clips to nothing (has_clip: false, 404 on HA's video
              # attachment). Only affects retention within already-flagged
              # bark/person review events here, not continuous recording.
              mode: all
