apiVersion: v1alpha1
kind: SysctlConfig
params:
  fs.inotify.max_user_watches: "1048576" # Watchdog
  fs.inotify.max_user_instances: "8192" # Watchdog
  net.core.rmem_max: "7500000" # Cloudflared | QUIC
  net.core.wmem_max: "7500000" # Cloudflared | QUIC
  net.ipv4.neigh.default.gc_thresh1: "4096" # Prevent ARP cache overflows
  net.ipv4.neigh.default.gc_thresh2: "8192" # Prevent ARP cache overflows
  net.ipv4.neigh.default.gc_thresh3: "16384" # Prevent ARP cache overflows
  net.ipv4.tcp_slow_start_after_idle: "0" # Preserve congestion window after idle
  user.max_user_namespaces: "11255" # User Namespaces
  # No usable IPv6 on this LAN - the only RAs on it come from Apple TVs
  # acting as Thread Border Routers (HomeKit/Matter), advertising a
  # ULA mesh-local prefix with no real route anywhere. Apps still get
  # real AAAA records for dual-stack internet hosts though, so without
  # this they race into a guaranteed ENETUNREACH on the IPv6 branch -
  # hit hardest by anything using hostNetwork (home-assistant), which
  # sees the node's real interface state instead of Cilium's pod
  # netns (which has no IPv6 at all, so never attempts it).
  net.ipv6.conf.all.disable_ipv6: "1"
  net.ipv6.conf.default.disable_ipv6: "1"
